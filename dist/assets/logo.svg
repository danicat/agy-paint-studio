<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="paletteSurface" x1="20" y1="22" x2="98" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="paletteRim" x1="16" y1="22" x2="106" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="dabBlue" x1="28" y1="65" x2="40" y2="77" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="dabRose" x1="35" y1="41" x2="47" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="dabAmber" x1="54" y1="32" x2="66" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="dabEmerald" x1="83" y1="59" x2="95" y2="71" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="paintTipGrad" x1="-5" y1="6" x2="5" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="swirlGrad" x1="54" y1="58" x2="72" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="-6" y1="-38" x2="6" y2="-4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="ferruleGrad" x1="-5.5" y1="-4" x2="5.5" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="12.5" y1="13.5" x2="31.5" y2="32.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Artist Palette with true cut-out thumb hole -->
  <path
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M 61 22 C 36.25 22 16 42.25 16 67 C 16 91.75 36.25 112 61 112 c 4.17 0 7.42 -3.36 7.42 -7.60 c 0 -1.97 -0.81 -3.76 -1.97 -5.06 c -1.31 -1.30 -1.97 -2.93 -1.97 -5.06 a 7.38 7.38 0 0 1 7.51 -7.51 h 8.98 c 13.73 0 25.00 -11.26 25.00 -24.99 C 105.84 40.05 85.57 22 61 22 Z M 56 92.5 A 6.5 6.5 0 1 0 43 92.5 A 6.5 6.5 0 1 0 56 92.5 Z"
    fill="url(#paletteSurface)"
    stroke="url(#paletteRim)"
    stroke-width="5.5"
    stroke-linejoin="round"
  />

  <!-- Four vibrant paint swatch dabs -->
  <circle cx="34" cy="71" r="7.5" fill="url(#dabBlue)"/>
  <circle cx="41" cy="47" r="8" fill="url(#dabRose)"/>
  <circle cx="60" cy="38" r="7.5" fill="url(#dabAmber)"/>
  <circle cx="89" cy="65" r="7.5" fill="url(#dabEmerald)"/>

  <!-- Wet paint swirl in mixing well -->
  <path d="M 69 58 C 73 62 71 70 64 73 C 58 75 53 71 55 65 C 56 61 63 59 69 58 Z" fill="url(#swirlGrad)"/>

  <!-- Angled artist paintbrush -->
  <g transform="translate(86, 42) rotate(45)">
    <path d="M -4.8 -4 C -6.0 -14 -6.0 -26 -3.6 -34.5 A 3.6 3.6 0 0 1 3.6 -34.5 C 6.0 -26 6.0 -14 4.8 -4 Z" fill="url(#handleGrad)" stroke="#9A3412" stroke-width="3" stroke-linejoin="round"/>
    <rect x="-5.5" y="-4" width="11" height="10" rx="2" fill="url(#ferruleGrad)" stroke="#334155" stroke-width="2.8"/>
    <path d="M -5.2 6 C -7.4 13 -6.4 21 -1.2 28 C 3.0 24.5 6.8 15.5 5.2 6 Z" fill="url(#paintTipGrad)" stroke="#4C1D95" stroke-width="2.8" stroke-linejoin="round"/>
  </g>

  <!-- 4-point Gemini sparkle accent -->
  <path d="M 22 13.5 L 24.6 20.4 L 31.5 23 L 24.6 25.6 L 22 32.5 L 19.4 25.6 L 12.5 23 L 19.4 20.4 Z" fill="url(#sparkGrad)" stroke="#B45309" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
